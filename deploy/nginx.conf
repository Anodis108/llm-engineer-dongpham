# Module III, Bài 5, Section 3 — nginx reverse proxy trước app (Compute Engine VM).
#
# File này CHỈ có block `listen 80`. Block HTTPS KHÔNG được viết sẵn ở đây.
#
# Lý do (bài học đã trả giá): viết sẵn `listen 443 ssl` mà chưa có chứng chỉ sẽ
# làm `nginx -t` fail cứng —
#     [emerg] no "ssl_certificate" is defined for the "listen ... ssl" directive
# — và khi đó `certbot --nginx` cũng không parse nổi config, nên cert KHÔNG BAO
# GIỜ được cấp. Bế tắc vòng tròn: cần cert để nginx chạy, cần nginx chạy để lấy
# cert. Cách đúng là để certbot TỰ nhân bản block dưới đây sang 443 và tự điền
# `ssl_certificate` khi cấp cert lần đầu (`certbot --nginx --redirect`).
#
# Hệ quả dễ chịu: mọi thiết lập trong block này — đặc biệt `proxy_buffering off`
# cho SSE — được certbot sao chép nguyên sang block 443. Cấu hình streaming chỉ
# cần viết MỘT lần, ở đây.
#
# Copy vào /etc/nginx/sites-available/llm-app, symlink vào sites-enabled, rồi
# `sudo nginx -t && sudo systemctl reload nginx` (deploy.sh làm việc này).

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;  # deploy.sh sed thay bằng domain thật

    # Cho phép certbot ACME challenge trước khi có HTTPS. Đây là lý do block
    # này phải trả lời được qua HTTP thay vì redirect thẳng sang HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # QUAN TRỌNG cho SSE (`/chat/stream-sse`, Bài 4 Section 4): nginx mặc định
    # BUFFER toàn bộ response trước khi trả về client -> client không thấy
    # token nào tới cho đến khi model sinh XONG, phá streaming hoàn toàn.
    # `proxy_buffering off` + tắt cache là bắt buộc cho route streaming.
    location /chat/stream-sse {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;   # stream có thể chạy lâu hơn timeout mặc định 60s
        chunked_transfer_encoding off;
    }

    # Endpoint streaming CŨ (Bài 1, text/plain) — cùng lý do, cần tắt buffering.
    location /chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
